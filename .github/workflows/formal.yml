name: Check confinement models
on:
  push:
    branches: [main, confinement-model, runtime-confinement-proof]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browsers for the admission contract fixture
        run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - name: Check runtime types and unit contracts
        run: |
          npm run typecheck
          npm run test:unit
      - run: python3 formal/claims/check.py
      - name: Challenge evidence and route checks
        run: python3 -m unittest discover -s formal/claims -p '*_test.py' -v
      - name: Check the runtime implementation review inventory
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/inventory.ts formal/runtime-verification/boundaries.ts
          node formal/runtime-verification/inventory.ts --check
      - name: Check pinned WebSpec coverage assessment
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck formal/runtime-verification/webspec-assessment.ts
          node formal/runtime-verification/webspec-assessment.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-implementation-review
          path: .tools/runtime-verification/implementation-sites.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webspec-coverage-assessment
          path: formal/runtime-verification/webspec-assessment.json
      - name: Download the pinned TLC release
        run: |
          mkdir -p .tools
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o .tools/tla2tools.jar
      - run: formal/confinement/check.sh
      - run: python3 formal/confinement/check-generation-reads.py
      - name: Check the pinned browser-surface inventory
        run: |
          python3 formal/idl-surface-report.py
          git diff --exit-code -- formal/evidence/idl-surface-report.json
          python3 formal/route-review/generate.py --check --verify-wpt
          python3 formal/context-join.py --check
      - name: Type-check and compare registry traces
        run: |
          npx tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/confinement/registry-trace-test.ts
          node formal/confinement/registry-trace-test.ts
          node --test formal/confinement/registry-concurrency-test.ts
      - name: Check native context storage and missing-constraint controls
        id: context_storage
        run: |
          rm -f results/contexts/controller-storage.json
          npm run build
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker test/controller-context-storage.ts
          node test/controller-context-storage.ts
      - name: Check that a wrong-owner mutation is detected
        run: |
          if REGISTRY_FAULT=wrong-owner node formal/confinement/registry-trace-test.ts > /tmp/registry-fault.log 2>&1; then
            echo 'Expected wrong-owner mutation to fail' >&2
            exit 1
          fi
          grep -q 'registry model mismatch' /tmp/registry-fault.log
      - uses: actions/upload-artifact@v4
        if: always() && (steps.context_storage.outcome == 'success' || steps.context_storage.outcome == 'failure')
        with:
          name: context-storage-contract
          path: results/contexts/controller-storage.json
  registration-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Observe same-scope update and unregister ordering
        id: registration_fence
        run: |
          rm -f formal/runtime-verification/registration-fence.json
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --lib ES2022,DOM,WebWorker --skipLibCheck formal/runtime-verification/registration-fence.ts
          node formal/runtime-verification/registration-fence.ts
      - uses: actions/upload-artifact@v4
        if: always() && (steps.registration_fence.outcome == 'success' || steps.registration_fence.outcome == 'failure')
        with:
          name: native-registration-fence
          path: formal/runtime-verification/registration-fence.json
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - name: Type-check native maintenance comparisons
        run: |
          rm -f formal/runtime-verification/maintenance-backends.json formal/runtime-verification/maintenance-unregistered.json formal/runtime-verification/message-resource-broker.json formal/runtime-verification/message-resource-broker-relaxed.json
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --lib ES2022,DOM,WebWorker --skipLibCheck formal/runtime-verification/maintenance-backends.ts formal/runtime-verification/message-resource-broker.ts
      - name: Compare local bootstraps, cached resources and messages
        run: node formal/runtime-verification/maintenance-backends.ts
      - name: Check retained delivery and new contexts after unregistration
        run: node formal/runtime-verification/maintenance-backends.ts
        env:
          PF_MAINTENANCE_UNREGISTER: '1'
      - name: Check message resource delivery and confirmed Chromium restart
        run: node formal/runtime-verification/message-resource-broker.ts
      - name: Check the relaxed-policy receiver control
        run: node formal/runtime-verification/message-resource-broker.ts
        env:
          PF_BROKER_RELAX_CSP: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-maintenance-comparisons
          path: |
            formal/runtime-verification/maintenance-backends.json
            formal/runtime-verification/maintenance-unregistered.json
            formal/runtime-verification/message-resource-broker.json
            formal/runtime-verification/message-resource-broker-relaxed.json
  worker-startup-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Remove historical startup receipts from the checkout
        run: rm -f formal/runtime-verification/service-worker-maintenance.json formal/runtime-verification/service-worker-startup-stale.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Compare worker script loading with native update controls
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/service-worker-maintenance.ts
          node formal/runtime-verification/service-worker-maintenance.ts
      - name: Check startup under the forced-stale Firefox age contract
        if: ${{ !cancelled() }}
        run: PF_STARTUP_STALE=1 node formal/runtime-verification/service-worker-maintenance.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-startup-maintenance
          path: |
            formal/runtime-verification/service-worker-maintenance.json
            formal/runtime-verification/service-worker-startup-stale.json
  module-delivery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Remove the historical module-policy receipt from the checkout
        run: |
          rm -f \
            formal/runtime-verification/module-loader-browser.json \
            formal/runtime-verification/module-loader-browser-persistent.json \
            formal/runtime-verification/module-loader-guard-browser.json \
            formal/runtime-verification/native-window-policy.json \
            formal/runtime-verification/native-worklet-policy.json \
            formal/runtime-verification/worklet-bundler-semantics.json \
            formal/runtime-verification/async-poll-calibration.json \
            formal/runtime-verification/local-shared-issuer-port.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Check the independent native script policy candidate
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/module-loader-browser.ts
          node formal/runtime-verification/module-loader-browser.ts
      - name: Check the module policy in temporary persistent full-browser profiles
        if: ${{ !cancelled() }}
        run: PF_MODULE_POLICY_PERSISTENT=1 node formal/runtime-verification/module-loader-browser.ts
      - name: Check module delivery through the prepared runtime worker
        if: ${{ !cancelled() }}
        run: |
          npm run build
          PF_MODULE_ACTUAL_GUARD=1 node formal/runtime-verification/module-loader-browser.ts
      - name: Check Window module loading under the independent script policy
        if: ${{ !cancelled() }}
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/native-window-policy.ts formal/runtime-verification/async-poll-calibration.ts
          node formal/runtime-verification/native-window-policy.ts
          node formal/runtime-verification/async-poll-calibration.ts
      - name: Check native worklet graph delivery and HTTP policy controls
        if: ${{ !cancelled() }}
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/native-worklet-policy.ts
          node formal/runtime-verification/native-worklet-policy.ts
      - name: Compare cyclic lexical initialization through worklet compilers
        if: ${{ !cancelled() }}
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/worklet-bundler-semantics.ts
          node formal/runtime-verification/worklet-bundler-semantics.ts
      - name: Check private-port shared-worker issuing prerequisites
        if: ${{ !cancelled() }}
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/local-shared-issuer.ts
          PF_SHARED_ISSUER_TRANSPORT=port node formal/runtime-verification/local-shared-issuer.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-delivery-native-policy
          path: |
            formal/runtime-verification/module-loader-browser.json
            formal/runtime-verification/module-loader-browser-persistent.json
            formal/runtime-verification/module-loader-guard-browser.json
            formal/runtime-verification/native-window-policy.json
            formal/runtime-verification/native-worklet-policy.json
            formal/runtime-verification/worklet-bundler-semantics.json
            formal/runtime-verification/async-poll-calibration.json
            formal/runtime-verification/local-shared-issuer-port.json
  worker-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Check worker parent brokers and authorization controls
        id: worker_closure
        run: |
          rm -f formal/runtime-verification/worker-closure-browser.json
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/worker-closure-browser.ts
          node formal/runtime-verification/worker-closure-browser.ts
      - name: Check native worker policy partitions and omission controls
        id: worker_policy
        run: |
          rm -f formal/runtime-verification/worker-policy-overlap.json
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/worker-policy-overlap.ts
          node formal/runtime-verification/worker-policy-overlap.ts
      - uses: actions/upload-artifact@v4
        if: always() && (steps.worker_policy.outcome == 'success' || steps.worker_policy.outcome == 'failure')
        with:
          name: worker-policy-partitions
          path: formal/runtime-verification/worker-policy-overlap.json
      - uses: actions/upload-artifact@v4
        if: always() && (steps.worker_closure.outcome == 'success' || steps.worker_closure.outcome == 'failure')
        with:
          name: worker-closure-contract
          path: formal/runtime-verification/worker-closure-browser.json
  browser-spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Remove historical spelling receipt before setup
        run: rm -f formal/runtime-verification/ua-spelling-browser.json formal/runtime-verification/spelling-dom-browser.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Check normal-profile spelling and actual setter omission
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/ua-spelling-browser.ts
          node formal/runtime-verification/ua-spelling-browser.ts
      - name: Compare native HTML attribute and parser routes in both engines
        if: ${{ !cancelled() }}
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/spelling-dom-browser.ts
          node formal/runtime-verification/spelling-dom-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-spelling-contract
          path: |
            formal/runtime-verification/ua-spelling-browser.json
            formal/runtime-verification/spelling-dom-browser.json
  resource-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Check installed message resource reads and actual transport bypass
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/resource-fetch-browser.ts
          node formal/runtime-verification/resource-fetch-browser.ts
      - name: Check dedicated worker reads, restart and transport bypass
        run: PF_RESOURCE_CONTEXT=worker node formal/runtime-verification/resource-fetch-browser.ts
      - name: Check local worker identity and native source-policy prerequisites
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/blob-worker-identity.ts formal/runtime-verification/local-bootstrap-policy.ts
          node formal/runtime-verification/blob-worker-identity.ts
          node formal/runtime-verification/local-bootstrap-policy.ts
      - name: Check production script URL gate and missing-enforcement controls
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker test/script-url-gate.ts
          node test/script-url-gate.ts
      - name: Compare trusted Worker callers and strict-mode omission
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/worker-caller-browser.ts
          node formal/runtime-verification/worker-caller-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-resource-fetch-evidence
          path: |
            formal/runtime-verification/resource-fetch-browser.json
            formal/runtime-verification/worker-resource-fetch-browser.json
            formal/runtime-verification/blob-worker-identity.json
            formal/runtime-verification/local-bootstrap-policy.json
            results/contexts/script-url-gate.json
            formal/runtime-verification/worker-caller-browser.json
  local-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Check native parent authentication and pending closure
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker test/parent-channel.ts
          node test/parent-channel.ts
      - name: Detect late receiver exposure and forged replies
        run: node test/parent-channel.ts
        env:
          PARENT_CHANNEL_LATE_RECEIVER: '1'
      - name: Characterize local document controller delivery after unregistration
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/runtime-verification/local-document-controller.ts
          node formal/runtime-verification/local-document-controller.ts
      - name: Check parent-mediated local document delivery
        run: node formal/runtime-verification/local-document-controller.ts
        env:
          PF_DOCUMENT_PARENT_RELAY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-document-controller-evidence
          path: |
            formal/runtime-verification/local-document-controller.json
            formal/runtime-verification/parent-document-broker.json
            results/contexts/parent-channel.json
            results/contexts/parent-channel-late-receiver.json
  registration-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      - name: Type-check registration overlap experiment
        run: npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --lib ES2022,DOM --skipLibCheck formal/runtime-verification/registration-overlap.ts
      - run: node formal/runtime-verification/registration-overlap.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-overlap-evidence
          path: formal/runtime-verification/registration-overlap.json
  fedcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - run: node formal/context-inventory.ts
      - run: python3 formal/context-join.py
      - run: node formal/fedcm-conditional-probe.ts
      - run: node formal/hyperlink-auditing-probe.ts
      - run: node formal/eventsource-beacon-probe.ts
      - run: node formal/reporting-probe.ts
      - run: node formal/modern-reporting-probe.ts
      - run: node formal/background-agents-probe.ts
      - run: node formal/fetch-later-probe.ts
      - run: node formal/websocket-fault-probe.ts
      - run: node formal/web-install-probe.ts
      - run: node formal/web-install-sandbox-fault.ts
      - uses: actions/upload-artifact@v4
        with:
          name: browser-effect-evidence
          path: |
            formal/evidence/fedcm-conditional.json
            formal/evidence/hyperlink-auditing.json
            formal/evidence/eventsource-beacon.json
            formal/evidence/reporting.json
            formal/evidence/modern-reporting.json
            formal/evidence/background-agents.json
            formal/evidence/fetch-later.json
            formal/evidence/websocket-fault.json
            formal/evidence/web-install.json
            formal/evidence/web-install-sandbox-fault.json
            formal/evidence/context-features.json
            formal/evidence/context-idl-join.json
  webtransport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r formal/webtransport/requirements.lock
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - run: npm run build
      - run: node --test test/runtime-admission.test.ts
      - run: node test/resource-paths.ts
      - run: node formal/cache-publisher-probe.ts
      - run: node formal/publisher-routes-probe.ts
      - run: node formal/publisher-navigate-probe.ts
      - run: node formal/worker-registration-probe.ts
      - run: node formal/navigation-preload-probe.ts
      - run: node formal/navigation-preload-fault.ts
      - name: Check installed-app navigation and actual guarded bundle
        run: |
          npx tsc --ignoreConfig --noEmit --strict --types node --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --lib ES2023,DOM,DOM.Iterable,WebWorker formal/implementation-navigation/installed-run.ts
          node formal/implementation-navigation/installed-run.ts
      - name: Check navigation cancellation during module initialization
        run: |
          npx tsc --ignoreConfig --noEmit --strict --types node --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --lib ES2023,DOM,DOM.Iterable,WebWorker formal/implementation-navigation/initialization-run.ts
          node formal/implementation-navigation/initialization-run.ts
      - run: node test/document-consumption-race.ts
      - run: node test/document-control.ts
      - run: node formal/document-consumption-fault.ts
      - run: node test/context-generation.ts
      - run: cp results/contexts/generation.json formal/evidence/generation-overlaps.json
      - run: node formal/webtransport/run.ts
        env:
          PF_WEBTRANSPORT_PYTHON: python
      - run: node formal/startup/local-run.ts
      - name: Compare observed startup events with the lifecycle model
        run: |
          mkdir -p .tools
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o .tools/tla2tools.jar
          npx tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck --types node --lib ES2023,DOM,DOM.Iterable,WebWorker formal/startup/lifecycle-trace-test.ts
          node formal/startup/lifecycle-trace-test.ts
          python3 formal/confinement/generation-trace-test.py
          node formal/admission/run.ts
      - uses: actions/upload-artifact@v4
        with:
          name: webtransport-evidence
