name: Test and publish host
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Use the Ubuntu HTTPS archive for browser dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - name: Prepare native audio and software graphics
        timeout-minutes: 5
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=20 install -y --no-install-recommends pulseaudio pulseaudio-utils strace xvfb xauth libgl1-mesa-dri libegl-mesa0 libglx-mesa0
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=privacy_frames_test
          pactl set-default-sink privacy_frames_test
      - run: npm test
      - run: npm run test:pitch
      - name: Build pinned publisher mirrors for application acceptance
        run: npm --prefix publisher-source run build
      - run: npm run test:compatibility
      - name: Exercise native and confined Wasm image applications
        run: xvfb-run -a npm run test:wasm-apps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: results/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-manager
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
