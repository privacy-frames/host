name: Check authority-graph proofs
on:
  push:
    branches: [main, confinement-model, runtime-confinement-proof]
    paths:
      [
        'formal/lean/**',
        'formal/path-lean/**',
        'formal/implementation-navigation/**',
        'formal/runtime-verification/**',
        'src/**',
        'scripts/**',
        'package-lock.json',
        '.github/workflows/lean.yml',
      ]
  pull_request:
    paths:
      [
        'formal/lean/**',
        'formal/path-lean/**',
        'formal/implementation-navigation/**',
        'formal/runtime-verification/**',
        'src/**',
        'scripts/**',
        'package-lock.json',
        '.github/workflows/lean.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type-check symbolic-analysis runner
        run: npx tsc --ignoreConfig --noEmit --strict --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck formal/implementation-navigation/gillian-check.ts
      - name: Analyze actual navigation callback and assertion-failure controls
        run: node formal/implementation-navigation/gillian-check.ts
      - name: Type-check deductive-mode calibration
        run: npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck formal/runtime-verification/method-calibration.ts formal/runtime-verification/document-publication-check.ts
      - name: Verify the stateful closure and reject its state-update fault
        run: node formal/runtime-verification/method-calibration.ts
      - name: Verify production document-publication state and postcondition faults
        run: node formal/runtime-verification/document-publication-check.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-deductive-calibration
          path: |
            formal/runtime-verification/method-calibration.json
            formal/runtime-verification/document-publication-result.json
            .tools/gillian-comparison/*.log
            .tools/document-publication/*.log
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-javascript-analysis
          path: |
            formal/implementation-navigation/gillian-result.json
            .tools/gillian-navigation/*.js
            .tools/gillian-navigation/*.log
          include-hidden-files: true
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .tools/lean-4.35.0-linux.tar.zst
          key: lean-4.35.0-linux-7289597a44543246
      - name: Fetch and verify the pinned Lean release
        run: |
          mkdir -p .tools
          if [ ! -f .tools/lean-4.35.0-linux.tar.zst ]; then
            curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o .tools/lean-4.35.0-linux.tar.zst
          fi
          printf '%s  %s\n' 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d .tools/lean-4.35.0-linux.tar.zst | sha256sum -c -
          tar --zstd -xf .tools/lean-4.35.0-linux.tar.zst -C .tools
      - run: python3 formal/lean/check.py
      - run: python3 formal/path-lean/check.py
      - name: Check prefix registration lifetimes and proof controls
        run: |
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck formal/runtime-verification/registration-lifetime-check.ts
          node formal/runtime-verification/registration-lifetime-check.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-lifetime-model
          path: |
            formal/runtime-verification/registration-lifetime.json
            .tools/registration-lifetime/*.lean
            .tools/registration-lifetime/*.log
          include-hidden-files: true
      - name: Verify the production authority predicate and actual omission controls
        id: authority_predicate
        run: |
          rm -f formal/runtime-verification/authority-predicate.json
          node --test formal/runtime-verification/gillian-report.test.ts
          npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck formal/runtime-verification/authority-predicate-check.ts
          node formal/runtime-verification/authority-predicate-check.ts
      - uses: actions/upload-artifact@v4
        if: always() && (steps.authority_predicate.outcome == 'success' || steps.authority_predicate.outcome == 'failure')
        with:
          name: authority-predicate-contracts
          path: |
            formal/runtime-verification/authority-predicate.json
            .tools/authority-predicate/*.js
            .tools/authority-predicate/*.log
          include-hidden-files: true
      - name: Type-check publication generation comparison
        run: npx tsc --ignoreConfig --noEmit --strict --noUnusedLocals --noUnusedParameters --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck formal/runtime-verification/generation-comparison.ts
      - name: Produce verified publication contracts for the backend comparison
        run: node formal/runtime-verification/document-publication-check.ts
      - name: Compare verified JavaScript with generated publication state
        run: node formal/runtime-verification/generation-comparison.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-generation-comparison
          path: |
            formal/runtime-verification/document-publication-result.json
            formal/runtime-verification/generation-comparison.json
            .tools/document-publication/*.js
            .tools/document-publication/*.log
            .tools/publication-generation/*
          include-hidden-files: true
      - run: node formal/implementation-navigation/check.ts
      - run: node formal/implementation-navigation/setup-check.ts
      - run: npm run build
        env:
          HOST_ROLE: runtime
      - run: node formal/implementation-navigation/bootstrap-check.ts
      - run: node formal/implementation-navigation/trusted-source-check.ts
      - run: node formal/implementation-navigation/build-source-check.ts
